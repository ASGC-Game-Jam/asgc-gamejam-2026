name: Package Repo

on:
  pull_request:
  #push:
    #tags:
      #- "v*"          # push a v* tag to trigger action
    

jobs:
  zip-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create ZIP archive
        # Excludes the .git folder and the .github workflows folder to keep the zip clean
        run: zip -r repo_${{ github.ref_name }}.zip . -x "*.git*" ".github/*"

      - name: Upload ZIP as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zipped-repo
          path: repo_${{ github.ref_name }}.zip
