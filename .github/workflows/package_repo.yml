name: Package Repo

on:
  pull_request:
  #push:
    #tags:
      #- "v*"          # push a v* tag to trigger action
    

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Print the branch name
        # short name of branch
        run: echo "BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
      - name: Set current time variable
        # Formats time as YYYY-MM-DD_HH-MM-SS
        run: echo "NOW=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV

  zip-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

        #- name: Create ZIP archive
        # Excludes the .git folder and the .github workflows folder to keep the zip clean
      #  run: zip -r repo.zip . -x "*.git*" ".github/*"

      - name: Archive repository
        uses: actions/upload-artifact@v4
        with:
          name: repo_${{ env.BRANCH }}_${{ env.NOW }}
          path: . -x "*.git*" ".github/*"
