name: Publish Release

on:
  push:
    tags:
      # using semver pattern for the tag in case we need other tags later
      - '*.*.*'
  workflow_dispatch:

jobs:
  github-release:
    runs-on: ubuntu-latest
    needs: build-release
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # keep as a draft to start with so we can manually attach the build files
          draft: true
          generate_release_notes: true
