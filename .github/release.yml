changelog:
  categories:
    - title: 🚀 New Features
      labels:
        - enhancement
        - feature
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
    - title: 📝 Documentation
      labels:
        - docs
        - documentation
    - title: ⚡ Performance Improvements
      labels:
        - performance
    - title: 🔧 Maintenance
      labels:
        - chore
        - maintenance
  exclude:
    labels:
      - duplicate
      - ignore
      - invalid
    authors:
      - dependabot
      - github-actions