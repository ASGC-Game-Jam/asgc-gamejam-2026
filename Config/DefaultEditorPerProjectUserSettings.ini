[ContentBrowser]
ContentBrowserTab1.SelectedPaths=/Game/ProjectAtlantis

; My Blueprint panel defaults. These are UPROPERTY(config) with no EditAnywhere, so they have
; no Editor Preferences UI — the gear dropdown in the My Blueprint panel or this file only.
; Project Atlantis puts real behaviour on C++ base classes (see Docs/Game Framework Classes.md),
; so a Blueprint that hides what it inherits is hiding most of what it actually does.
; Note: a user who has already toggled these locally keeps their own value; their
; Saved/Config/WindowsEditor/EditorPerProjectUserSettings.ini wins over this file.
[/Script/BlueprintGraph.BlueprintEditorSettings]
bShowInheritedVariables=True
bShowAccessSpecifier=True
bShowParentClassInOverrides=True
